<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EchoFlow</title>
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
<header>
  <div class="brand">EchoFlow <em>2.0</em></div>
  <div class="host" id="host">—</div>
</header>

<div class="controls">
  <div class="axes" id="axes">
    <label><input type="checkbox" value="design" checked> Design</label>
    <label><input type="checkbox" value="ux" checked> UX</label>
    <label><input type="checkbox" value="engine" checked> Engine</label>
  </div>

  <div class="btn-row">
    <button id="scan" class="btn btn-main">Analyse this page</button>
    <button id="add" class="btn" title="Collect this page and keep browsing">+ Add page</button>
  </div>
  <div class="btn-row auto-row">
    <button id="auto" class="btn" title="Read the sitemap, pick a representative sample, and collect them">Find pages for me</button>
  </div>

  <div class="auto" id="autopanel" hidden></div>

  <div class="pages" id="pages" hidden>
    <div class="pages-head"><b id="pagecount">0</b> <span id="pageword">pages collected</span></div>
    <ul id="pagelist"></ul>
  </div>

  <p class="hint" id="hint">
    Comparative checks — the ones that measure consistency <b>across</b> pages —
    need at least two pages of the same type. Browse to another product and hit
    <b>+ Add page</b>.
  </p>
</div>

<nav class="tabs" id="tabs" hidden>
  <button data-tab="review" class="on">Design review</button>
  <button data-tab="findings">Findings</button>
  <button data-tab="structure">Structure</button>
</nav>

<main id="out">
  <div class="empty">Open a storefront and hit <strong>Analyse this page</strong>.</div>
</main>

<footer id="foot" hidden>
  <button id="export" class="btn">Export wiki bundle</button>
  <button id="send" class="btn" title="Save the audit where the MCP server can read it, and copy the line to paste">Send to Claude</button>
</footer>

<script type="module" src="sidepanel.js"></script>
</body>
</html>
