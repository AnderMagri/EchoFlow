<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EchoFlow</title>
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
<header>
  <div class="brand">EchoFlow <em id="ver">2.0</em></div>
  <div class="host" id="host">—</div>
  <div class="ui-mode" id="uimode" role="group" aria-label="Interface">
    <button type="button" data-ui="colour" aria-pressed="true" title="Follows your system light or dark setting">Colour</button>
    <button type="button" data-ui="white" aria-pressed="false" title="Black and white on white, whatever your system is set to — exported reports follow it">White</button>
  </div>
</header>

<div class="controls">
  <div class="axes" id="axes" role="group" aria-label="Axes to measure">
    <label class="axis"><input type="checkbox" value="design" checked><span><i class="tick">&#10003;</i>Design</span></label>
    <label class="axis"><input type="checkbox" value="ux" checked><span><i class="tick">&#10003;</i>UX</span></label>
    <label class="axis"><input type="checkbox" value="engine" checked><span><i class="tick">&#10003;</i>Engine</span></label>
  </div>

  <div class="btn-row">
    <button id="scan" class="btn btn-main">Analyse this page</button>
    <button id="add" class="btn" title="Collect this page and keep browsing">+ Add page</button>
  </div>
  <div class="btn-row auto-row">
    <button id="auto" class="btn" title="Read the sitemap, pick a representative sample, and collect them">Find pages for me</button>
  </div>

  <div class="auto" id="autopanel" hidden></div>

  <div class="pages" id="pages" hidden>
    <div class="pages-head"><b id="pagecount">0</b> <span id="pageword">pages collected</span></div>
    <ul id="pagelist"></ul>
  </div>

  <p class="hint" id="hint">
    Comparative checks — the ones that measure consistency <b>across</b> pages —
    need at least two pages of the same type. Browse to another product and hit
    <b>+ Add page</b>.
  </p>
</div>

<nav class="tabs" id="tabs" hidden>
  <button data-tab="review" class="on">Design review</button>
  <button data-tab="findings">Findings</button>
  <button data-tab="structure">Structure</button>
</nav>

<main id="out">
  <div class="empty">Open a storefront and hit <strong>Analyse this page</strong>.</div>
</main>

<footer id="foot" hidden>
  <button id="export" class="btn">Export wiki bundle</button>
  <button id="send" class="btn" title="Push the audit to the running MCP server, or save it if that is not available">Send to Claude</button>
</footer>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <header>
    <h2 id="sheet-title"></h2>
    <button class="x" id="sheet-close" aria-label="Close">&#10005;</button>
  </header>
  <div id="sheet-body"></div>
</section>

<script type="module" src="sidepanel.js"></script>
</body>
</html>
