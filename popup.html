<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EchoFlow</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header class="header">
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <circle cx="10" cy="10" r="9" fill="#00C9A7"/>
          <path d="M6 10L9 13L14 7" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="logo-text">EchoFlow</span>
      </div>
      <span class="version">v1.1</span>
    </header>

    <!-- Main Tabs -->
    <nav class="popup-tabs">
      <button class="popup-tab active" data-popup-tab="page-review">Page Review</button>
      <button class="popup-tab" data-popup-tab="project-review">Project</button>
      <button class="popup-tab" data-popup-tab="shopify-adapt">Shopify Adapt</button>
    </nav>

    <!-- ═══ Page Review Tab ═══ -->
    <div id="tab-page-review" class="popup-tab-content active">
      <div id="capture-panel">
        <section class="section">
          <label class="section-label">Audit Vertical</label>
          <div class="vertical-grid">
            <button class="vertical-card active" data-vertical="generic-ux">
              <span class="vertical-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg></span>
              <span class="vertical-name">Generic UX</span>
            </button>
            <button class="vertical-card" data-vertical="shopify">
              <span class="vertical-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg></span>
              <span class="vertical-name">Shopify</span>
            </button>
            <button class="vertical-card" data-vertical="fintech">
              <span class="vertical-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg></span>
              <span class="vertical-name">Fintech</span>
            </button>
            <button class="vertical-card" data-vertical="crypto">
              <span class="vertical-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M14.5 9.5c-.5-1-1.5-1.5-2.5-1.5-1.66 0-3 1-3 2.5S10.34 13 12 13c1.66 0 3 1 3 2.5S13.66 18 12 18c-1 0-2-.5-2.5-1.5"/><line x1="12" y1="6" x2="12" y2="8"/><line x1="12" y1="16" x2="12" y2="20"/></svg></span>
              <span class="vertical-name">Crypto</span>
            </button>
          </div>
        </section>

        <!-- Page Type Sub-selector (hidden for generic-ux) -->
        <section id="page-type-section" class="section" style="display:none;">
          <label class="section-label">Page Type</label>
          <select id="page-type-select" class="page-type-select"></select>
        </section>

        <section class="section">
          <label class="section-label">Capture Mode</label>
          <div class="mode-options">
            <label class="mode-option">
              <input type="radio" name="mode" value="viewport" checked>
              <span class="mode-label">Viewport</span>
            </label>
            <label class="mode-option">
              <input type="radio" name="mode" value="full_page">
              <span class="mode-label">Full Page</span>
            </label>
            <label class="mode-option">
              <input type="radio" name="mode" value="region">
              <span class="mode-label">Region</span>
            </label>
          </div>
        </section>

        <section class="section">
          <label class="section-label">Screenshot Resolution</label>
          <div class="mode-options">
            <label class="mode-option">
              <input type="radio" name="resolution" value="100" checked>
              <span class="mode-label">100%</span>
            </label>
            <label class="mode-option">
              <input type="radio" name="resolution" value="120">
              <span class="mode-label">120% HD</span>
            </label>
          </div>
        </section>

        <button id="run-audit-btn" class="btn-primary">
          <span class="btn-text">Run Audit</span>
          <span class="btn-spinner" style="display:none;">
            <svg width="16" height="16" viewBox="0 0 16 16" class="spinner">
              <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="2" fill="none" stroke-dasharray="30 10" stroke-linecap="round"/>
            </svg>
          </span>
        </button>

        <div id="status" class="status"></div>

        <div class="divider"></div>

        <button id="load-audit-btn" class="btn-secondary">
          Load Saved Audit
        </button>
        <input type="file" id="file-input" accept=".echoflow,.json" style="display:none;">
      </div>
    </div>

    <!-- ═══ Project Review Tab ═══ -->
    <div id="tab-project-review" class="popup-tab-content">
      <div class="section">
        <label class="section-label">Project</label>
        <div class="project-selector">
          <select id="project-select" class="page-type-select">
            <option value="">Select a project...</option>
            <option value="__new__">+ New Project</option>
          </select>
        </div>
        <div id="new-project-row" class="new-project-row" style="display:none;">
          <input type="text" id="new-project-name" class="text-input" placeholder="Project name...">
          <button id="btn-create-project" class="btn-sm-primary">Create</button>
        </div>
      </div>

      <!-- Active project info -->
      <div id="project-info" class="section" style="display:none;">
        <div class="project-info-card">
          <div class="project-info-name" id="project-info-name"></div>
          <div class="project-info-stats" id="project-info-stats"></div>
        </div>

        <!-- Batch Audit -->
        <label class="section-label" style="margin-top:12px;">Batch Audit URLs</label>
        <textarea id="batch-urls" class="batch-textarea" rows="4" placeholder="Paste URLs, one per line..."></textarea>

        <div class="batch-controls">
          <select id="batch-vertical" class="page-type-select batch-vertical-select">
            <option value="generic-ux">Generic UX</option>
            <option value="shopify">Shopify</option>
            <option value="fintech">Fintech</option>
            <option value="crypto">Crypto</option>
          </select>
          <button id="btn-batch-audit" class="btn-primary btn-batch">
            <span class="btn-text">Batch Audit</span>
            <span class="btn-spinner" style="display:none;">
              <svg width="16" height="16" viewBox="0 0 16 16" class="spinner">
                <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="2" fill="none" stroke-dasharray="30 10" stroke-linecap="round"/>
              </svg>
            </span>
          </button>
        </div>

        <div id="batch-progress" class="batch-progress" style="display:none;">
          <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
          <div id="progress-text" class="progress-text">Auditing 0 of 0...</div>
          <button id="btn-batch-stop" class="btn-sm-secondary">Stop</button>
        </div>

        <div class="divider"></div>

        <button id="btn-view-project" class="btn-secondary">View Project Results</button>
        <button id="btn-delete-project" class="btn-danger-sm">Delete Project</button>
      </div>

      <div id="project-status" class="status"></div>
    </div>

    <!-- ═══ Shopify Adapt Tab ═══ -->
    <div id="tab-shopify-adapt" class="popup-tab-content">
      <div class="section">
        <div class="adapt-intro">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#00C9A7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
          <p class="adapt-desc">Analyze the current page and evaluate what's viable in Shopify — native, app-based, or custom development needed.</p>
        </div>
      </div>

      <button id="btn-adapt-analyze" class="btn-primary btn-adapt">
        <span class="btn-text">Analyze for Shopify</span>
        <span class="btn-spinner" style="display:none;">
          <svg width="16" height="16" viewBox="0 0 16 16" class="spinner">
            <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="2" fill="none" stroke-dasharray="30 10" stroke-linecap="round"/>
          </svg>
        </span>
      </button>

      <div id="adapt-status" class="status"></div>
    </div>

    <!-- Error Panel -->
    <div id="error-panel" style="display:none;">
      <div class="error-box">
        <p id="error-message"></p>
      </div>
      <button id="retry-btn" class="btn-secondary">Try Again</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
