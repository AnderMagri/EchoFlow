<!DOCTYPE html><html><head><meta charset="utf-8"><style>
/* container 960, 8 columns, 20px gutter -> col = (960 - 7*20)/8 = 102.5px */
body{margin:0}.wrap{max-width:960px;margin:0 auto}
.row{display:flex;gap:20px;margin-bottom:20px}
.c2{width:225px;height:150px;background:#eee}    /* 2*102.5 + 20   */
.c3{width:347.5px;height:150px;background:#e8e8e8} /* 3*102.5 + 2*20 — ODD span */
.c5{width:592.5px;height:150px;background:#e0e0e0} /* 5*102.5 + 4*20 — ODD span */
.c4{width:470px;height:150px;background:#ddd}    /* 4*102.5 + 3*20 */
.c8{width:960px;height:100px;background:#f0f0f0}
</style></head><body><div class="wrap">
<div class="row"><div class="c8">full</div></div>
<div class="row"><div class="c2">2</div><div class="c2">2</div><div class="c2">2</div><div class="c2">2</div></div>
<div class="row"><div class="c3">3</div><div class="c5">5</div></div>
<div class="row"><div class="c5">5</div><div class="c3">3</div></div>
<div class="row"><div class="c4">4</div><div class="c4">4</div></div>
</div></body></html>
