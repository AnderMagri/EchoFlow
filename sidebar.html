<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EchoFlow</title>
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <div class="sb-app">

    <!-- Tabs -->
    <nav class="sb-tabs">
      <button class="sb-tab active" data-sb-tab="design">Design</button>
      <button class="sb-tab" data-sb-tab="audit">Audit</button>
      <button class="sb-tab" data-sb-tab="explorer">Explorer</button>
      <button class="sb-tab" data-sb-tab="migration">Migration</button>
      <button class="sb-tab" data-sb-tab="settings">Settings</button>
    </nav>

    <!-- ═══ Design Tab ═══ -->
    <div id="sb-tab-design" class="sb-tab-content active">

      <div class="sb-scan-bar">
        <button id="sb-scan-btn" class="sb-scan-primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          <span id="sb-scan-label">Scan Design</span>
        </button>
        <button id="sb-fullaudit-btn" class="sb-scan-secondary" title="Run full UX audit">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
          Full Audit
        </button>
      </div>

      <div id="sb-design-empty" class="sb-empty">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#ddd" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l2 2"/></svg>
        <p>Scan any page to see its design health score.</p>
      </div>

      <div id="sb-design-results" style="display:none;">
        <div id="sb-health-overview" class="sb-health-overview"></div>
        <div id="sb-card-color"      class="sb-design-card"></div>
        <div id="sb-card-typography" class="sb-design-card"></div>
        <div id="sb-card-structure"  class="sb-design-card"></div>
        <div id="sb-card-access"     class="sb-design-card"></div>
        <div id="sb-scanned-url"     class="sb-scanned-url"></div>
      </div>

      <div id="sb-design-status" class="sb-status"></div>
    </div>

    <!-- ═══ Audit Tab ═══ -->
    <div id="sb-tab-audit" class="sb-tab-content">

      <section class="sb-section">
        <label class="sb-label">Vertical</label>
        <div class="sb-vertical-grid">
          <button class="sb-vertical active" data-vertical="generic-ux">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            <span>Generic UX</span>
          </button>
          <button class="sb-vertical" data-vertical="shopify">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
            <span>Shopify</span>
          </button>
          <button class="sb-vertical" data-vertical="fintech">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
            <span>Fintech</span>
          </button>
          <button class="sb-vertical" data-vertical="crypto">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M14.5 9.5c-.5-1-1.5-1.5-2.5-1.5-1.66 0-3 1-3 2.5S10.34 13 12 13c1.66 0 3 1 3 2.5S13.66 18 12 18c-1 0-2-.5-2.5-1.5"/><line x1="12" y1="6" x2="12" y2="8"/><line x1="12" y1="16" x2="12" y2="20"/></svg>
            <span>Crypto</span>
          </button>
        </div>
      </section>

      <section id="sb-page-type-section" class="sb-section" style="display:none;">
        <label class="sb-label">Page Type</label>
        <select id="sb-page-type-select" class="sb-select"></select>
      </section>

      <section class="sb-section">
        <label class="sb-label">Device</label>
        <div class="sb-device-row">
          <button class="sb-device active" data-device="desktop">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            Desktop
          </button>
          <button class="sb-device" data-device="mobile">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
            Mobile
          </button>
          <button class="sb-device" data-device="tablet">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
            Tablet
          </button>
        </div>
      </section>

      <button id="sb-run-audit-btn" class="sb-btn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <span id="sb-run-audit-label">Run Full Audit</span>
      </button>

      <div id="sb-audit-status" class="sb-status"></div>
    </div>

    <!-- ═══ Explorer Tab ═══ -->
    <div id="sb-tab-explorer" class="sb-tab-content">

      <!-- Tech Stack — populated by Design scan or its own scan btn -->
      <div id="sb-card-tech" class="sb-design-card sb-card-tech-explorer"></div>
      <div class="sb-tech-scan-bar" id="sb-tech-scan-bar">
        <button id="sb-tech-scan-btn" class="sb-btn-outline sb-btn-full">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          Detect Tech Stack
        </button>
      </div>

      <section class="sb-section">
        <label class="sb-label">Scan Settings</label>
        <div class="sb-filter-grid">
          <div class="sb-filter-row">
            <span class="sb-filter-label">Max pages</span>
            <select id="sb-max-pages" class="sb-select-sm">
              <option value="50">50</option>
              <option value="100" selected>100</option>
              <option value="200">200</option>
              <option value="500">500</option>
            </select>
          </div>
          <div class="sb-filter-row">
            <span class="sb-filter-label">Max depth</span>
            <select id="sb-max-depth" class="sb-select-sm">
              <option value="2">2 levels</option>
              <option value="3" selected>3 levels</option>
              <option value="5">5 levels</option>
              <option value="10">10 levels</option>
            </select>
          </div>
          <div class="sb-filter-row">
            <span class="sb-filter-label">Skip pattern</span>
            <input type="text" id="sb-skip-pattern" class="sb-input-sm" placeholder="/blog/, /tag/">
          </div>
          <div class="sb-filter-row">
            <span class="sb-filter-label">Include SEO data</span>
            <label class="sb-toggle">
              <input type="checkbox" id="sb-include-seo" checked>
              <span class="sb-toggle-track"></span>
            </label>
          </div>
        </div>
      </section>
      <section class="sb-section">
        <label class="sb-label">Discover Pages</label>
        <p class="sb-hint">Map this site's pages grouped by template type.</p>
        <div id="sb-platform-banner" style="display:none;"></div>
        <div class="sb-discover-btns">
          <button id="sb-discover-sitemap" class="sb-btn-outline">Sitemap</button>
          <button id="sb-discover-crawl"   class="sb-btn-outline">Crawl Links</button>
        </div>
        <div id="sb-discover-progress" style="display:none;" class="sb-progress-row">
          <span id="sb-discover-progress-text" class="sb-hint"></span>
          <button id="sb-discover-stop" class="sb-btn-tiny">Stop</button>
        </div>
      </section>
      <div id="sb-discover-summary" style="display:none;">
        <div id="sb-discover-total" class="sb-discover-total"></div>
        <div id="sb-discover-groups" class="sb-discover-groups"></div>
        <div class="sb-discover-actions">
          <button id="sb-discover-use" class="sb-btn-outline">Use for Batch</button>
          <button id="sb-discover-csv" class="sb-btn-outline">Export CSV</button>
        </div>
      </div>
      <div id="sb-explorer-status" class="sb-status"></div>
    </div>

    <!-- ═══ Migration Tab ═══ -->
    <div id="sb-tab-migration" class="sb-tab-content">
      <section class="sb-section">
        <p class="sb-hint">Analyze the current page for Shopify viability — native, app, or custom dev.</p>
      </section>
      <button id="sb-migrate-btn" class="sb-btn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
        <span id="sb-migrate-label">Analyze for Shopify</span>
      </button>
      <div id="sb-migrate-status" class="sb-status"></div>
    </div>

    <!-- ═══ Settings Tab ═══ -->
    <div id="sb-tab-settings" class="sb-tab-content">
      <section class="sb-section">
        <label class="sb-label">Claude API Key</label>
        <input type="password" id="sb-claude-key" class="sb-input" placeholder="sk-ant-...">
        <button id="sb-save-settings" class="sb-btn-primary" style="margin-top:8px;">Save</button>
        <div id="sb-settings-status" class="sb-status"></div>
      </section>
      <div class="sb-settings-version">EchoFlow v2.2</div>
    </div>

  </div>

  <script src="sidebar.js"></script>
</body>
</html>
