<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EchoFlow</title>
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <div class="sb-app">

    <!-- Header -->
    <header class="sb-header">
      <div class="sb-header-right">
        <span class="sb-version">v1.9</span>
        <button id="sb-settings-btn" class="sb-icon-btn" title="API Settings">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <!-- Tabs -->
    <nav class="sb-tabs">
      <button class="sb-tab active" data-sb-tab="design">Design</button>
      <button class="sb-tab" data-sb-tab="audit">Audit</button>
      <button class="sb-tab" data-sb-tab="explorer">Explorer</button>
      <button class="sb-tab" data-sb-tab="migration">Migration</button>
    </nav>

    <!-- ═══ Design Tab ═══ -->
    <div id="sb-tab-design" class="sb-tab-content active">

      <div class="sb-scan-bar">
        <button id="sb-scan-btn" class="sb-scan-primary">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          <span id="sb-scan-label">Scan Design</span>
        </button>
        <button id="sb-fullaudit-btn" class="sb-scan-secondary" title="Run full UX audit">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
          Full Audit
        </button>
      </div>

      <div id="sb-design-empty" class="sb-empty">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ddd" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l2 2"/></svg>
        <p>Scan any page to see its design health score.</p>
      </div>

      <div id="sb-design-results" style="display:none;">
        <div id="sb-health-overview" class="sb-health-overview"></div>
        <div id="sb-card-color"      class="sb-design-card"></div>
        <div id="sb-card-typography" class="sb-design-card"></div>
        <div id="sb-card-structure"  class="sb-design-card"></div>
        <div id="sb-card-access"     class="sb-design-card"></div>
        <div id="sb-scanned-url"     class="sb-scanned-url"></div>
      </div>

      <div id="sb-design-status" class="sb-status"></div>
    </div>

    <!-- ═══ Audit Tab ═══ -->
    <div id="sb-tab-audit" class="sb-tab-content">

      <section class="sb-section">
        <label class="sb-label">Vertical</label>
        <div class="sb-vertical-grid">
          <button class="sb-vertical active" data-vertical="generic-ux">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            <span>Generic UX</span>
          </button>
          <button class="sb-vertical" data-vertical="shopify">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
            <span>Shopify</span>
          </button>
          <button class="sb-vertical" data-vertical="fintech">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
            <span>Fintech</span>
          </button>
          <button class="sb-vertical" data-vertical="crypto">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M14.5 9.5c-.5-1-1.5-1.5-2.5-1.5-1.66 0-3 1-3 2.5S10.34 13 12 13c1.66 0 3 1 3 2.5S13.66 18 12 18c-1 0-2-.5-2.5-1.5"/><line x1="12" y1="6" x2="12" y2="8"/><line x1="12" y1="16" x2="12" y2="20"/></svg>
            <span>Crypto</span>
          </button>
        </div>
      </section>

      <section id="sb-page-type-section" class="sb-section" style="display:none;">
        <label class="sb-label">Page Type</label>
        <select id="sb-page-type-select" class="sb-select"></select>
      </section>

      <section class="sb-section">
        <label class="sb-label">Device</label>
        <div class="sb-device-row">
          <button class="sb-device active" data-device="desktop">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            Desktop
          </button>
          <button class="sb-device" data-device="mobile">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
            Mobile
          </button>
          <button class="sb-device" data-device="tablet">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
            Tablet
          </button>
        </div>
      </section>

      <button id="sb-run-audit-btn" class="sb-btn-primary">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <span id="sb-run-audit-label">Run Full Audit</span>
      </button>

      <div id="sb-audit-status" class="sb-status"></div>
    </div>

    <!-- ═══ Explorer Tab ═══ -->
    <div id="sb-tab-explorer" class="sb-tab-content">
      <section class="sb-section">
        <label class="sb-label">Discover Pages</label>
        <p class="sb-hint">Map every page of this site, grouped by template type.</p>
        <div id="sb-platform-banner" style="display:none;"></div>
        <div class="sb-discover-btns">
          <button id="sb-discover-sitemap" class="sb-btn-outline">Sitemap</button>
          <button id="sb-discover-crawl"   class="sb-btn-outline">Crawl Links</button>
        </div>
        <div id="sb-discover-progress" style="display:none;" class="sb-progress-row">
          <span id="sb-discover-progress-text" class="sb-hint"></span>
          <button id="sb-discover-stop" class="sb-btn-tiny">Stop</button>
        </div>
      </section>
      <div id="sb-discover-summary" style="display:none;">
        <div id="sb-discover-total" class="sb-discover-total"></div>
        <div id="sb-discover-groups" class="sb-discover-groups"></div>
        <div class="sb-discover-actions">
          <button id="sb-discover-use" class="sb-btn-outline">Use for Batch</button>
          <button id="sb-discover-csv" class="sb-btn-outline">Export CSV</button>
        </div>
      </div>
      <div id="sb-explorer-status" class="sb-status"></div>
    </div>

    <!-- ═══ Migration Tab ═══ -->
    <div id="sb-tab-migration" class="sb-tab-content">
      <section class="sb-section">
        <p class="sb-hint">Analyze the current page for Shopify viability — native, app, or custom dev.</p>
      </section>
      <button id="sb-migrate-btn" class="sb-btn-primary">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
        <span id="sb-migrate-label">Analyze for Shopify</span>
      </button>
      <div id="sb-migrate-status" class="sb-status"></div>
    </div>

    <!-- Settings Panel (overlay) -->
    <div id="sb-settings-panel" class="sb-settings-overlay" style="display:none;">
      <div class="sb-settings-box">
        <div class="sb-settings-header">
          <h2 class="sb-settings-title">Settings</h2>
          <button id="sb-settings-close" class="sb-icon-btn">✕</button>
        </div>
        <label class="sb-label">Claude API Key</label>
        <input type="password" id="sb-claude-key" class="sb-input" placeholder="sk-ant-...">
        <button id="sb-save-settings" class="sb-btn-primary" style="margin-top:6px;">Save</button>
        <div id="sb-settings-status" class="sb-status"></div>
      </div>
    </div>

  </div>

  <script src="sidebar.js"></script>
</body>
</html>
